<h1>Galerie</h1>
<p class="lead">Ein paar Bilder vom Haus und vom See. Die Wirklichkeit ist besser.</p>
<section class="gallery">
  <figure>
    <img src="pictures/see.svg" alt="Blick vom Steg nach Süden">
    <figcaption>Morgens um sieben, bevor die Segler kommen.</figcaption>
  </figure>
  <figure>
    <img src="pictures/haus.svg" alt="Das Haus von der Seeseite">
    <figcaption>Gebaut 1911, seit 1962 unsere Pension.</figcaption>
  </figure>
  <figure>
    <img src="pictures/garten.svg" alt="Der Garten im Juni">
    <figcaption>Rosen, Salat und ein Apfelbaum, der jedes Jahr zu viel trägt.</figcaption>
  </figure>
  <figure>
    <img src="pictures/boot.svg" alt="Unser Ruderboot">
    <figcaption>Liegt am Steg, der Schlüssel hängt am Empfang.</figcaption>
  </figure>
  <figure>
    <img src="pictures/abend.svg" alt="Abend am See">
    <figcaption>Der Himmel macht hier jeden Tag etwas anderes.</figcaption>
  </figure>
  <figure>
    <img src="pictures/dorf.svg" alt="Prien, zehn Minuten zu Fuß">
    <figcaption>Bäcker, Metzger, Kirche und der Dampfersteg.</figcaption>
  </figure>
</section>
